# The Meddleware login theme for Keycloak (ADR-0016, FU-0182). It extends the `base` theme (messages, the page list, the server-side logic) and replaces the markup, styles and scripts of every page the
# platform's browser flow shows. No inline script, no inline style, no inline event handler (the realm's Content-Security-Policy refuses them), no third-party host, no font file, nothing stored in the browser.
parent=base
# (No `import=` line: an empty one breaks the theme loader.) No PatternFly: the pages use the platform's design tokens (css/tokens.css, vendored from @meddleware/design-tokens) and css/login.css.
stylesCommon=
styles=css/tokens.css css/login.css
# Blocking, external: sets the light or dark scheme from the system setting before the first paint (js/theme-init.js).
scripts=js/theme-init.js
# The page's own script (WebAuthn calls, the one-click logout guard) is loaded by the templates as an external module.
kcHtmlClass=
kcBodyClass=
# The theme's version, appended to every stylesheet and script URL as ?v=. Keycloak's resource URLs do not change when a theme changes (the path carries the server's version, not the theme's) and its
# static files are cached by the browser for 30 days, so without this a browser keeps the previous release's CSS and JS beside the new templates (seen on 2026-11-27: the colour switch appeared without
# its styles or script). It must equal the newest released version in CHANGELOG.md: tests/smoke.sh checks.
themeVersion=0.0.5

